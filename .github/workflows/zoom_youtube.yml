name: Z2Y

on:
  repository_dispatch:
    types: [Z T]

jobs:
  DAU:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Prep URL
        run: |
          echo "${{ github.event.client_payload.zoom_url }}" > urls.txt

      - name: Z R DL (Playwright)
        run: |
          # 1. Clone the downloader repository
          git clone https://github.com/katcinskiy/zoom-downloader.git
          cd zoom-downloader

          # 2. Install Python dependencies and Playwright's Chromium
          pip install -r requirements.txt
          playwright install chromium

          # 3. Run the downloader on your share link
          python zoom_downloader.py "${{ github.event.client_payload.zoom_url }}"
          
          # 4. Move the downloaded MP4 back to the workspace root for upload.js
          mv *.mp4 "${{ github.workspace }}/" || true
          
      - name: Y U
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
          VIDEO_VISIBILITY: ${{ github.event.client_payload.visibility }}
        run: node upload.js

