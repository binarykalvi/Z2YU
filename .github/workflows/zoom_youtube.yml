name: Z2Y

on:
  repository_dispatch:
    types: [Z T]

jobs:
  DAU:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Prep URL
        run: |
          echo "${{ github.event.client_payload.zoom_url }}" > urls.txt
          
      - name: Z R DL (Playwright)
        run: |
          # 1. Clone the downloader repository
          git clone https://github.com/katcinskiy/zoom-downloader.git
          cd zoom-downloader

          # 2. Install dependencies + Playwright (with Ubuntu 26.04 workaround)
          pip install requests playwright>=1.64.1
          playwright install chromium

          # 3. Run the downloader. The script returns exit code 1 after a
          #    harmless "Watch recording" click failure even when the file
          #    was saved successfully, so we tolerate the exit code and
          #    verify the file ourselves.
          python zoom_downloader.py "${{ github.event.client_payload.zoom_url }}" || true

          # 4. Verify the download actually happened
          if [ ! -f zoom_recording.mp4 ]; then
            echo "ERROR: zoom_recording.mp4 was not created."
            exit 1
          fi

          # 5. Move the file to the workspace root so upload.js finds it
          mv zoom_recording.mp4 "${{ github.workspace }}/"
          echo "Moved zoom_recording.mp4 to workspace root."
          ls -la "${{ github.workspace }}"/*.mp4
          
      - name: Y U
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
          VIDEO_VISIBILITY: ${{ github.event.client_payload.visibility }}
        run: node upload.js

